name: Terraform Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    services:
      localstack:
        image: localstack/localstack:latest
        ports:
          - 4566:4566
        env:
          SERVICES: s3
          DEBUG: 1
        options: >-
          --health-cmd="curl -f http://localhost:4566/health || exit 1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Wait for LocalStack to be ready
        run: |
          echo "Esperando a que LocalStack esté listo..."
          for i in {1..20}; do
            if curl -s http://localhost:4566/health | grep '"s3": "running"' > /dev/null; then
              echo "LocalStack está listo."
              break
            fi
            echo "Esperando... ($i/20)"
            sleep 3
          done

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve
